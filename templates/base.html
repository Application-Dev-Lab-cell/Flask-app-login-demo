<!DOCTYPE html>
<html>
<head>
    <title>DevOps App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>DevOps Application</h1>
        {% if session.username %}
            <p>Welcome, {{ session.username }} | <a href="{{ url_for('logout') }}">Logout</a></p>
        {% endif %}
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
